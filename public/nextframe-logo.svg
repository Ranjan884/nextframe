<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <!-- Clean white background -->
  <rect width="600" height="600" fill="#FFFFFF" />

  <!-- Monogram Symbol -->
  <g id="nextframe-symbol">
    <!-- N Glyph: Left vertical bar with angled bottom + Dynamic diagonal slash -->
    <!-- Left vertical bar of N -->
    <path
      d="M 185 120 L 220 120 L 220 205 L 185 240 Z"
      fill="#171D27"
    />

    <!-- Main dynamic diagonal of N extending downward to sharp point -->
    <path
      d="M 185 120 L 225 120 L 318 285 L 290 285 Z"
      fill="#171D27"
    />

    <!-- F Glyph: Top bar with chamfer, vertical stem, and middle bar -->
    <!-- Top horizontal bar of F with 45-degree chamfer on right -->
    <path
      d="M 295 130 L 415 130 L 388 158 L 330 158 L 330 130 Z"
      fill="#171D27"
    />

    <!-- Vertical stem of F -->
    <path
      d="M 295 130 L 330 130 L 330 225 L 295 225 Z"
      fill="#171D27"
    />

    <!-- Blue Triangle Accent (The Play Icon / Forward Frame) -->
    <path
      d="M 334 175 L 368 200 L 334 225 Z"
      fill="#2457D6"
    />

    <!-- Lower horizontal bar of F -->
    <path
      d="M 374 190 L 415 190 L 415 225 L 374 225 Z"
      fill="#171D27"
    />
  </g>

  <!-- Wordmark: NEXFRAME -->
  <g id="nextframe-wordmark" transform="translate(300, 375)">
    <text
      text-anchor="middle"
      font-family="'Inter', 'Manrope', -apple-system, sans-serif"
      font-weight="900"
      font-size="46"
      letter-spacing="0.28em"
    >
      <tspan fill="#171D27">NEX</tspan>
      <tspan fill="#2457D6">FR</tspan>
      <!-- Stylized Lambda A -->
      <tspan fill="#2457D6">&#923;</tspan>
      <tspan fill="#2457D6">ME</tspan>
    </text>
  </g>

  <!-- Divider & Subtitle: ——— STUDIO ——— -->
  <g id="nextframe-studio-line">
    <line x1="160" y1="422" x2="232" y2="422" stroke="#171D27" stroke-width="1.5" />
    <text
      x="300"
      y="428"
      text-anchor="middle"
      font-family="'Inter', 'Manrope', -apple-system, sans-serif"
      font-weight="600"
      font-size="19"
      letter-spacing="0.45em"
      fill="#171D27"
    >
      STUDIO
    </text>
    <line x1="368" y1="422" x2="440" y2="422" stroke="#171D27" stroke-width="1.5" />
  </g>

  <!-- Disciplines / Subcaption -->
  <text
    x="300"
    y="472"
    text-anchor="middle"
    font-family="'Inter', 'Manrope', -apple-system, sans-serif"
    font-weight="400"
    font-size="13.5"
    letter-spacing="0.08em"
    fill="#667085"
  >
    Video Editing   |   Full Stack Development   |   Website &amp; App Design
  </text>
</svg>
